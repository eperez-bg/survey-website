name: survey_admin_web
description: Internal Flutter web tool for reviewing, editing, calculating, and exporting store surveys.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  pdf: 3.13.0
  excel_community: 2.3.0
  file_saver: 0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_survey_v9.json
